name: Docker Publish

on:
  release:
    types: [published]

jobs:
  docker:
    name: 构建并推送后端 Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-office:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-office:${{ github.ref_name }}
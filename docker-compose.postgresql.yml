version: '3.8'

# PostgreSQL + 后端服务完整编排
# 使用方式：docker-compose -f docker-compose.postgresql.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg15
    container_name: siapp-postgres
    environment:
      # 初始超级用户
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
      # 初始数据库
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # 数据持久化
      - postgresql_data:/var/lib/postgresql/data
      # 初始化脚本（可选）
      - ./scripts/init-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - siapp-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siapp-backend
    environment:
      # PostgreSQL 配置
      SIAPP_DATABASE_TYPE: postgres
      SIAPP_DB_HOST: postgres          # Docker 网络中 PostgreSQL 容器的名称
      SIAPP_DB_PORT: 5432
      SIAPP_DB_USER: siapp
      SIAPP_DB_PASSWORD: siapp_password
      SIAPP_DB_NAME: siapp
      SIAPP_DB_SSLMODE: disable
      
      # 服务配置
      SIAPP_ADDR: :8080
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_TOKEN_DURATION: 12h
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      
      # 日志配置
      LOG_LEVEL: debug
      APP_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - siapp-network
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...'
        sleep 5
        echo 'Starting backend service...'
        ./siapp
      "

  # 前端服务（可选）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siapp-frontend
    environment:
      # API 配置
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
      NEXT_PUBLIC_API_BASE_URL_DOMAIN: http://localhost:8080/api
      NEXT_PUBLIC_API_BASE_URL_IP: http://127.0.0.1:8080/api
      NEXT_PUBLIC_API_IPV4_FALLBACK_PORT: 8080
      INTERNAL_API_BASE_URL: http://backend:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - siapp-network

networks:
  siapp-network:
    driver: bridge

volumes:
  postgresql_data:
    driver: local

# ======================== 使用说明 ========================
# 
# 启动服务：
#   docker-compose -f docker-compose.postgresql.yml up -d
#
# 查看日志：
#   docker-compose -f docker-compose.postgresql.yml logs -f backend
#   docker-compose -f docker-compose.postgresql.yml logs -f postgres
#
# 连接数据库：
#   psql -U siapp -h localhost -d siapp -p 5432
#   # 密码：siapp_password
#
# 停止服务：
#   docker-compose -f docker-compose.postgresql.yml down
#
# 清除数据（谨慎！）：
#   docker-compose -f docker-compose.postgresql.yml down -v
#
# 创建初始数据库和用户：
#   docker-compose -f docker-compose.postgresql.yml exec postgres psql -U postgres -c \
#     "CREATE USER siapp WITH ENCRYPTED PASSWORD 'siapp_password'; \
#      CREATE DATABASE siapp OWNER siapp; \
#      GRANT ALL PRIVILEGES ON DATABASE siapp TO siapp;"
#
# ======================== 注意事项 ========================
#
# 1. 首次启动时，PostgreSQL 会自动创建数据库和用户
#    （如果使用了 scripts/init-postgresql.sql）
#
# 2. 生产环境更改：
#    - POSTGRES_PASSWORD：强密码
#    - siapp_password：强密码
#    - JWT_SECRET_KEY：长随机字符串
#    - SIAPP_DB_SSLMODE：改为 require
#    - 移除 LOG_LEVEL: debug
#    - 移除 APP_ENV: development
#
# 3. 默认账户：admin/admin123
#
# 4. API 访问：http://localhost:8080/api
#
# 5. 前端访问：http://localhost:3000

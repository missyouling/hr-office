services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siapp-backend
    ports:
      - "10011:8080"  # 主机端口10011映射到容器端口8080
    env_file:
      - .env  # 从.env文件加载环境变量
    environment:
      # 覆盖默认配置
      - SIAPP_ADDR=:8080
      - SIAPP_DATABASE_PATH=./data/siapp.db
      # 生产环境安全配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-this-in-production}
      - JWT_TOKEN_DURATION=${JWT_TOKEN_DURATION:-12h}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - APP_ENV=${APP_ENV:-development}
    volumes:
      - backend_data:/app/data  # 持久化数据库与上传文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://0.0.0.0:8080/health > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - siapp-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL_DOMAIN: ${NEXT_PUBLIC_API_BASE_URL_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL_IP: ${NEXT_PUBLIC_API_BASE_URL_IP}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_API_IPV4_FALLBACK_PORT: ${NEXT_PUBLIC_API_IPV4_FALLBACK_PORT}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
    container_name: siapp-frontend
    ports:
      - "10010:8080"  # 主机端口10010映射到容器端口8080
    env_file:
      - .env  # 统一从 .env 加载环境变量
    environment:
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - siapp-network

  # ============================================================
  # WeKnora docreader 文档解析微服务
  # 支持 Word/Excel/PPT/Markdown/PDF 等多格式文档解析
  # 构建方式：从 /home/WeKnora/docreader 源码构建，添加 HTTP 桥接
  # 如需禁用，注释掉此节即可
  # ============================================================
  docreader:
    build:
      context: /home/WeKnora/docreader
      dockerfile: /home/hr-office/deploy/docreader/Dockerfile
    container_name: hr-office-docreader
    ports:
      - "50051:50051"  # gRPC（WeKnora 原生协议）
      - "50052:50052"  # HTTP 桥接（hr-office 调用入口 /parse, /health）
    environment:
      - PORT=50051
      - DOCREADER_GRPC_PORT=50051
      - GRPC_MAX_WORKERS=4
      - MAX_FILE_SIZE_MB=50
      - HTTP_PORT=50052
      - LOG_LEVEL=INFO
    volumes:
      - docreader_data:/tmp/docreader
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50052/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - siapp-network

volumes:
  # 持久化后端数据
  backend_data:
    driver: local
  # docreader 临时数据
  docreader_data:
    driver: local

networks:
  # 应用网络
  siapp-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: fd00:dead:cafe::/64
